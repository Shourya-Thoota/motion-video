<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame Studio composition</title>
<style>
  /* Fonts must be local. Add @font-face with a bundled licensed file if needed. */
  :root { --paper:#f4f1ea; --ink:#16161a; --muted:#6b6862; --accent:#e4572e; --rule:#d9d4c8;
          --font: "Lato","Inter","Helvetica Neue",Arial,sans-serif; }
  html,body { margin:0; background:#000; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--paper);
           color:var(--ink); font-family:var(--font); font-variant-numeric:tabular-nums; }
  .scene { position:absolute; inset:0; padding:96px 120px; box-sizing:border-box; opacity:0; }
  .kicker { font-size:34px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .headline { font-size:128px; line-height:1.02; font-weight:900; margin-top:28px; max-width:1500px; }
  .headline span { display:inline-block; margin-right:.22em; }
  .sub { font-size:40px; color:var(--muted); margin-top:36px; max-width:1200px; }
  .chart-title { font-size:64px; font-weight:800; }
  .bars { position:absolute; left:120px; right:120px; bottom:170px; height:560px; display:flex; gap:56px;
          align-items:flex-end; border-bottom:4px solid var(--ink); }
  .bar { flex:1; position:relative; }
  .bar .fill { position:absolute; left:0; right:0; bottom:0; background:var(--ink); border-radius:10px 10px 0 0; }
  .bar.hl .fill { background:var(--accent); }
  .bar .val { position:absolute; left:0; right:0; text-align:center; font-size:52px; font-weight:800; }
  .bar .lab { position:absolute; left:0; right:0; bottom:-74px; text-align:center; font-size:34px; color:var(--muted); }
  .source { position:absolute; left:120px; bottom:48px; font-size:24px; color:var(--muted); }
  .big { font-size:300px; font-weight:900; line-height:1; color:var(--accent); margin-top:120px; }
  .bigcap { font-size:56px; font-weight:700; margin-top:24px; max-width:1300px; }
  .end { position:absolute; left:120px; bottom:110px; font-size:36px; color:var(--muted); }
  .end b { color:var(--ink); }
</style>
</head>
<body>
<div id="stage">
  <section class="scene" id="s1"><div class="kicker" id="kicker"></div><div class="headline" id="headline"></div><div class="sub" id="sub"></div></section>
  <section class="scene" id="s2"><div class="chart-title" id="ctitle"></div><div class="bars" id="bars"></div><div class="source" id="source"></div></section>
  <section class="scene" id="s3"><div class="big" id="big"></div><div class="bigcap" id="bigcap"></div><div class="end" id="end"></div></section>
</div>
<script>
// ============ CONTENT: edit words, numbers, colors, and timing here ============
const CONTENT = {
  format: { width: 1920, height: 1080, fps: 30 },
  colors: { accent: "#e4572e" },
  intro: { start: 0, dur: 3.6, kicker: "Quarterly update", headline: "Signups grew every month this quarter", sub: "A 12-second look at what changed." },
  chart: { start: 3.6, dur: 5.0, title: "New signups (thousands)", unit: "k",
           data: [["July", 42], ["Aug", 55], ["Sept", 71], ["Oct", 96]], highlight: 3, source: "Source: sample data for the template" },
  outro: { start: 8.6, dur: 3.4, value: "auto", suffix: "%", caption: "growth from July to October", end: "<b>Your brand</b> · yoursite.com" },
};
// ===============================================================================

const W = CONTENT.format.width, H = CONTENT.format.height;
window.STUDIO = { width: W, height: H, fps: CONTENT.format.fps,
  duration: CONTENT.outro.start + CONTENT.outro.dur };
document.documentElement.style.setProperty("--accent", CONTENT.colors.accent);
document.getElementById("stage").style.cssText += `width:${W}px;height:${H}px`; // 9:16 → width 1080, height 1920; then adjust layout CSS

// ---- deterministic helpers ----
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, start, dur) => clamp((t - start) / dur);
const E = {
  outCubic: (p) => 1 - Math.pow(1 - p, 3),
  outExpo: (p) => (p === 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  inCubic: (p) => p * p * p,
  inOut: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
};
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const $ = (id) => document.getElementById(id);
// Scene envelope: fade/slide in over `inD`, out over `outD` at the end of the scene.
function envelope(t, s, inD = 0.5, outD = 0.45) {
  const pin = E.outCubic(prog(t, s.start, inD));
  const pout = E.inCubic(prog(t, s.start + s.dur - outD, outD));
  const push = 1 + 0.025 * prog(t, s.start, s.dur); // slow camera push keeps holds alive
  return { o: pin * (1 - pout), y: (1 - pin) * 40 - pout * 30, k: push };
}

// ---- build static DOM once ----
const C = CONTENT;
// "auto" = percent growth from first to last data point, so the stat never disagrees with the chart.
if (C.outro.value === "auto") { const d = C.chart.data; C.outro.value = Math.round((d[d.length - 1][1] / d[0][1] - 1) * 100); }
$("kicker").textContent = C.intro.kicker;
$("headline").innerHTML = C.intro.headline.split(" ").map((w) => `<span>${w}</span>`).join("");
$("sub").textContent = C.intro.sub;
$("ctitle").textContent = C.chart.title;
$("source").textContent = C.chart.source;
const maxV = Math.max(...C.chart.data.map((d) => d[1]));
$("bars").innerHTML = C.chart.data.map(([l], i) =>
  `<div class="bar${i === C.chart.highlight ? " hl" : ""}"><div class="fill"></div><div class="val"></div><div class="lab">${l}</div></div>`).join("");
$("bigcap").textContent = C.outro.caption;
$("end").innerHTML = C.outro.end;
const words = [...$("headline").children], bars = [...$("bars").children];

// ---- the frame function: state is computed from t only ----
window.renderFrame = function (t) {
  // Scene 1: kicker, staggered headline words, subline
  let s = C.intro, e = envelope(t, s);
  $("s1").style.opacity = e.o; $("s1").style.transform = `translateY(${e.y}px) scale(${e.k})`;
  $("kicker").style.opacity = E.outCubic(prog(t, s.start + 0.1, 0.5));
  words.forEach((w, i) => { const p = E.outExpo(prog(t, s.start + 0.25 + i * 0.08, 0.7));
    w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 60}px)`; });
  const ps = E.outCubic(prog(t, s.start + 0.9 + words.length * 0.08, 0.6));
  $("sub").style.opacity = ps; $("sub").style.transform = `translateY(${(1 - ps) * 20}px)`;

  // Scene 2: bars grow in data order, values count up and land exactly
  s = C.chart; e = envelope(t, s);
  $("s2").style.opacity = e.o; $("s2").style.transform = `translateY(${e.y}px) scale(${e.k})`;
  bars.forEach((b, i) => { const v = C.chart.data[i][1];
    const p = E.outCubic(prog(t, s.start + 0.5 + i * 0.25, 1.1));
    const h = (v / maxV) * 480 * p;
    b.querySelector(".fill").style.height = h + "px";
    const val = b.querySelector(".val"); val.textContent = Math.round(v * p) + C.chart.unit;
    val.style.bottom = h + 14 + "px"; val.style.opacity = clamp(p * 3); });

  // Scene 3: big number counts up, caption and end card
  s = C.outro; e = envelope(t, s, 0.5, 0.001);
  $("s3").style.opacity = e.o; $("s3").style.transform = `translateY(${e.y}px) scale(${e.k})`;
  const pb = E.outExpo(prog(t, s.start + 0.2, 1.4));
  $("big").textContent = Math.round(C.outro.value * pb) + C.outro.suffix;
  const pc = E.outCubic(prog(t, s.start + 0.8, 0.6));
  $("bigcap").style.opacity = pc; $("bigcap").style.transform = `translateY(${(1 - pc) * 24}px)`;
  $("end").style.opacity = E.outCubic(prog(t, s.start + 1.4, 0.6));
};

// ---- preview only (ignored by the renderer): open the file, ?t=4 to freeze ----
if (!window.__STUDIO_RENDER) {
  const q = new URLSearchParams(location.search);
  document.body.style.cssText = "display:grid;place-items:center;min-height:100vh;background:#111";
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H) * 0.96; $("stage").style.transform = `scale(${k})`; };
  fit(); addEventListener("resize", fit);
  if (q.has("t")) window.renderFrame(Number(q.get("t")));
  else { const t0 = performance.now(); const loop = (n) => { window.renderFrame(((n - t0) / 1000) % STUDIO.duration); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
} else { window.renderFrame(0); }
</script>
</body>
</html>
